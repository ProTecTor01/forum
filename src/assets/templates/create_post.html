{{ define "content" }}
<h2>create post</h2>
{{ if .Error }}
    <p class="error-message">{{ .Error }}</p>
{{ end }}
{{ if .UserID }}
    <form method="POST" action="/posts/create">
        <label for="title">title:</label>
        <input type="text" name="title" id="title" maxlength="200" required value="{{ .Title}}">
        <label for="body">body:</label>
        <textarea name="body" id="body" maxlength="3000" required>{{ .Body }}</textarea>
        <fieldset>
            <legend>categories</legend>
            {{ range .Categories }}
                <label><input type="checkbox" name="category_ids" value="{{ .ID }}"> {{ .Name }}</label><br>
            {{ else }}
                <p>no categories available</p>
            {{ end }}
        </fieldset>
        <button type="submit">create post</button>
    </form>
{{ else }}
    <p><a href="/login">login to create a post</a></p>
{{ end }}
<p><a href="/posts">back to posts</a></p>
{{ end }}
